name: Idea or feature
description: Something the tool should do, or do better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to get done?
      description: The situation in your week, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Capture a note, Log your week, Excel output, Rules and checks, Sources, Setup and docs, Other]
